<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f8f9fc" />
<title>Mis gastos · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f7f8fc;--surface:#fff;--text:#18213a;--muted:#8992a6;--border:#e9edf4;--purple:#6258e8;--soft:#efedff;--green:#178f74;--shadow:0 8px 28px rgba(30,41,74,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}.app{width:min(100%,480px);margin:auto;min-height:100dvh;padding:22px 20px 104px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px}.logo{width:39px;height:39px;background:var(--purple);border-radius:14px;color:white;display:grid;place-items:center;font-size:20px}.brand strong{font-size:17px;letter-spacing:-.5px}.eyebrow{display:block;color:var(--muted);font-size:11px;margin-top:3px}.avatar{width:38px;height:38px;border-radius:50%;background:#fde5dd;color:#ba684b;display:grid;place-items:center;font-weight:750}.heading{margin-bottom:19px}.heading h1{font-size:25px;letter-spacing:-.8px;margin:0 0 4px;font-weight:800}.heading p{color:var(--muted);margin:0;font-size:13px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:13px}.label{font-size:12px;font-weight:750;color:#606b83;margin-bottom:13px;display:block}.amount{display:flex;align-items:center;gap:8px;margin:0 0 14px}.currency{font-size:30px;color:#a0a8ba;font-weight:600}.amount input{min-width:0;width:100%;border:0;outline:0;color:var(--text);font-weight:800;font-size:44px;letter-spacing:-1.8px;background:transparent}.amount input::placeholder{color:#d4d9e4}.fieldrow{display:flex;gap:10px;align-items:center}.datepill{border:1px solid var(--border);border-radius:12px;background:#fafbfe;padding:11px 13px;color:#606b83;font-size:12px;display:flex;align-items:center;gap:8px;width:max-content;position:relative}.datepill input{position:static;opacity:1;width:auto;max-width:100%;min-height:24px;cursor:pointer;border:0;background:transparent;color:var(--text);font:inherit;font-weight:650;outline:0;color-scheme:light}.datepill input::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.8}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.sectionhead h2{font-size:15px;letter-spacing:-.3px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}.accounts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.account{border:1.5px solid var(--border);border-radius:15px;padding:12px 4px 11px;background:#fff;cursor:pointer;color:#5e6880;display:flex;flex-direction:column;align-items:center;gap:9px;font-weight:700;font-size:11px;min-height:78px}.account .accicon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#f4f6fa}.account.active{border-color:var(--purple);background:#f7f6ff;color:var(--purple)}.account.active .accicon{background:#e8e4ff}.searchbox{height:43px;border:1px solid var(--border);border-radius:12px;display:flex;gap:10px;align-items:center;color:#9ca4b5;padding:0 13px;background:#fafbfe}.searchbox input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;min-width:0}.searchbox input::placeholder{color:#aab1bf}.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:13px 0 5px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:100px;padding:8px 12px;font-size:11px;font-weight:700;color:#667188;cursor:pointer}.chip.active{color:#fff;border-color:var(--purple);background:var(--purple)}.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:245px;overflow-y:auto;padding:7px 1px 2px;scrollbar-width:thin}.cat{position:relative;min-height:76px;border:1.5px solid var(--border);border-radius:13px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;font-size:10px;font-weight:650;line-height:1.2;color:#667188;text-align:center}.cat .emoji{font-size:22px}.cat.active{border-color:var(--purple);background:#f8f7ff;color:var(--purple)}.cat.active:after{content:'✓';position:absolute;right:6px;top:5px;width:15px;height:15px;border-radius:50%;color:#fff;background:var(--purple);font-size:10px;display:grid;place-items:center}.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted)}.notes{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 13px;background:#fafbfe;color:var(--text);outline:0;font-family:inherit;font-size:13px;resize:none}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,248,252,0),#f7f8fc 18%)}.save{width:100%;border:0;border-radius:16px;background:var(--purple);color:#fff;padding:17px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 9px 19px rgba(98,88,232,.23)}.save:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.history{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px}.item:last-child{border-bottom:0;padding-bottom:0}.itemicon{width:39px;height:39px;background:#f4f5ff;border-radius:12px;display:grid;place-items:center;font-size:18px}.itemmain{flex:1;min-width:0}.itemtitle{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemsub{font-size:11px;color:var(--muted);margin-top:4px}.itemamount{font-size:13px;font-weight:800}.toast{position:fixed;z-index:4;top:15px;left:50%;transform:translateX(-50%);background:#19233a;color:white;padding:12px 16px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);display:none;max-width:90%;text-align:center}.muted{color:var(--muted);font-size:12px}.footerlink{display:block;text-align:center;color:#8a93a6;font-size:11px;margin:10px 0 4px}.clear{background:none;border:0;font-size:11px;color:#a3aabb;cursor:pointer}.flag{display:inline-block;font-size:9px;color:var(--green);background:#e8faf4;border-radius:9px;padding:4px 7px;font-weight:800;margin-left:5px}@media(max-width:355px){.app{padding-left:13px;padding-right:13px}.bottom{padding-left:13px;padding-right:13px}.accounts{gap:5px}.account{font-size:10px}.panel{padding:15px}.chip{padding:7px 9px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<section class="panel"><label class="label" for="amount">¿Cuánto gastaste?</label><div class="amount"><span class="currency">$</span><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off"></div><div class="fieldrow"><label class="datepill" for="date">🗓️ <input id="date" type="date" aria-label="Fecha del gasto"></label></div></section>
<section class="panel"><div class="sectionhead"><h2>¿De dónde salió?</h2><span>Selecciona una cuenta</span></div><div class="accounts" id="accounts"></div></section>
<section class="panel"><div class="sectionhead"><h2>¿En qué gastaste?</h2><span id="selectionLabel">Elige una categoría</span></div><label class="searchbox">⌕ <input id="search" placeholder="Buscar categoría..." autocomplete="off" aria-label="Buscar categoría"></label><div class="chips" id="groups"></div><div class="catgrid" id="categories"></div></section>
<section class="panel"><label class="label" for="notes">Nota <span style="font-weight:400;color:#a4acbb">(opcional)</span></label><textarea class="notes" rows="2" id="notes" placeholder="Ej. Supermercado, comida, café..."></textarea></section>
<section class="panel"><div class="sectionhead"><h2>Últimos movimientos</h2><button class="clear" id="clearHistory" type="button">Borrar historial</button></div><div class="history" id="history"><div class="muted">Aún no hay gastos registrados.</div></div></section>
<div class="footerlink">Diseñado para registrar un gasto en segundos ♡</div>
</div>
<div class="bottom"><button class="save" id="save" disabled>Guardar gasto →</button></div>
<script>
const GROUPS=[
{n:'Esenciales',e:'🛒',items:[['Alimentos','🥑'],['Higiene / Cuidado personal','🧴'],['Lavandería','🧺'],['Ropa y calzado Vale','👗'],['Ropa y calzado Angel','👕'],['Médico','🩺'],['GYM','💪']]},
{n:'Transporte',e:'🚗',items:[['Gasolina','⛽'],['Seguro Auto','🛡️'],['Servicio Auto','🔧'],['Tenencia Auto','🚙'],['Verificación Auto','📋'],['Servicio Moto','🏍️'],['Tenencia Moto','🛵']]},
{n:'Hogar',e:'🏡',items:[['Luz','💡'],['Gas','🔥'],['Internet','📶'],['Mantenimiento vivienda','🧰']]},
{n:'Suscripciones',e:'📱',items:[['Telcel Angel','📲'],['Telcel Vale','📲'],['Spotify / YouTube','🎵'],['HBO','🎬'],['Disney','🍿']]},
{n:'Ocio y eventos',e:'🎉',items:[['Entretenimiento / Salidas','🍿'],['Regalos y eventos','🎁'],['Vacaciones','🏖️']]},
{n:'Mascotas',e:'🐾',items:[['Gatas','🐈'],['Perros','🐕']]},
{n:'Personales',e:'💜',items:[['Gastos Angel','🙋'],['Gastos Vale','🙋‍♀️']]},
{n:'Familia',e:'👨‍👩‍👧',items:[['Gasto Karina','🌻'],['Gasto Abue Lucy','🌷'],['Gasto Maricela','🌸']]},
{n:'Educación',e:'🎓',items:[['Anáhuac','📚']]},
{n:'Ahorros e inversión',e:'💰',items:[['Fondo de emergencia','🧯'],['INVI','🏘️'],['PPR','📈'],['Ahorros','🐷']]}
];
const ACCOUNTS=[['Débito','💳'],['Banamex','🔵'],['Plata','🟣'],['Efectivo','💵']];
const $=id=>document.getElementById(id);
const safeParse=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}};
let history=safeParse('gastos_v1',[]),selectedAccount=safeParse('cuenta_v1','Débito'),selectedCategory='',activeGroup='Frecuentes';
const recent=safeParse('categorias_v1',[]);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
$('date').value=today();
$('date').addEventListener('change',validate);
function drawAccounts(){$('accounts').innerHTML='';ACCOUNTS.forEach(([name,emoji])=>{let b=document.createElement('button');b.className='account'+(name===selectedAccount?' active':'');b.type='button';b.innerHTML=`<span class="accicon">${emoji}</span><span>${name}</span>`;b.onclick=()=>{selectedAccount=name;localStorage.setItem('cuenta_v1',JSON.stringify(name));drawAccounts()};$('accounts').appendChild(b)})}
function candidates(){let all=GROUPS.flatMap(g=>g.items.map(([n,e])=>({n,e,g:g.n})));let q=$('search').value.trim().toLocaleLowerCase('es');if(q)return all.filter(x=>(x.n+' '+x.g).toLocaleLowerCase('es').includes(q));if(activeGroup==='Frecuentes'){let names=recent.length?recent.slice(0,9):['Alimentos','Gasolina','Gastos Vale','Entretenimiento / Salidas','Higiene / Cuidado personal','Gatas'];return names.map(n=>all.find(x=>x.n===n)).filter(Boolean)}return all.filter(x=>x.g===activeGroup)}
function drawCategories(){$('groups').innerHTML='';['Frecuentes',...GROUPS.map(g=>g.n)].forEach(n=>{let b=document.createElement('button');b.className='chip'+(activeGroup===n?' active':'');b.textContent=n==='Frecuentes'?'⭐ Frecuentes':(GROUPS.find(g=>g.n===n)?.e+' '+n);b.onclick=()=>{activeGroup=n;$('search').value='';drawCategories()};$('groups').appendChild(b)});const items=candidates();$('categories').innerHTML='';if(!items.length){$('categories').innerHTML='<div class="empty">No encontramos esa categoría.</div>'}items.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='cat'+(x.n===selectedCategory?' active':'');b.innerHTML=`<span class="emoji">${x.e}</span><span>${x.n}</span>`;b.onclick=()=>{selectedCategory=x.n;$('selectionLabel').textContent=x.n;drawCategories();validate()};$('categories').appendChild(b)})}
$('search').addEventListener('input',drawCategories);
function validate(){const v=Number($('amount').value);$('save').disabled=!(Number.isFinite(v)&&v>0&&selectedCategory&&selectedAccount&&$('date').value)}
$('amount').addEventListener('input',validate);
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawHistory(){const h=$('history');h.innerHTML='';if(!history.length){h.innerHTML='<div class="muted">Aún no hay gastos registrados.</div>';return}history.slice(0,5).forEach(x=>{const icon=GROUPS.flatMap(g=>g.items).find(a=>a[0]===x.category)?.[1]||'💸';const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="itemicon">${icon}</div><div class="itemmain"><div class="itemtitle">${esc(x.category)}</div><div class="itemsub">${esc(x.account)} · ${esc(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="itemamount">−${money(x.amount)}</div>`;h.appendChild(el)})}
let toastTimeout;function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').style.display='none',2800)}
$('save').onclick=()=>{if($('save').disabled)return;const expense={id:Date.now(),amount:Math.round(Number($('amount').value)*100)/100,date:$('date').value,category:selectedCategory,group:GROUPS.find(g=>g.items.some(i=>i[0]===selectedCategory))?.n,account:selectedAccount,note:$('notes').value.trim()};history.unshift(expense);localStorage.setItem('gastos_v1',JSON.stringify(history));const idx=recent.indexOf(selectedCategory);if(idx>=0)recent.splice(idx,1);recent.unshift(selectedCategory);localStorage.setItem('categorias_v1',JSON.stringify(recent.slice(0,12)));$('amount').value='';$('notes').value='';selectedCategory='';activeGroup='Frecuentes';$('search').value='';$('selectionLabel').textContent='Elige una categoría';drawCategories();drawHistory();validate();toast('✓ Gasto registrado correctamente');try{window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success')}catch(e){}; /* Integración real: enviar expense a API propia autenticada para persistencia compartida */};
$('clearHistory').onclick=()=>{if(!history.length)return;if(confirm('¿Eliminar todos los gastos guardados en este dispositivo?')){history=[];localStorage.setItem('gastos_v1','[]');drawHistory();toast('Historial local eliminado')}};
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}
drawAccounts();drawCategories();drawHistory();validate();
</script>
</body>
</html>
